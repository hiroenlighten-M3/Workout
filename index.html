<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WORKOUT TERMINAL V2</title>
<style>
  :root {
    --bg: #090b0e;
    --panel: #13171d;
    --border: #222933;
    --text: #e1e7ed;
    --muted: #627282;
    --accent: #ff334b; /* クリムゾンレッド */
    --green: #00e676;
    --side-l: #38bdf8;  /* Left: シアン */
    --side-r: #f59e0b;  /* Right: アンバー */
    --btn-bg: #181d24;
    --btn-active: #28313d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 10px;
    gap: 8px;
  }
  /* ヘッダー */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 6px var(--green);
  }

  /* 部位セレクター（タブ） */
  .category-tabs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .cat-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 0;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
  }
  .cat-btn.active {
    background: #1e2633;
    border-color: #3b82f6;
    color: #60a5fa;
  }

  /* 種目セレクター（スクロール対応） */
  .exercise-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    max-height: 86px;
    overflow-y: auto;
  }
  .ex-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: #94a3b8;
    padding: 7px 6px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ex-btn.active {
    background: #231216;
    border-color: var(--accent);
    color: #ff6b7d;
  }

  /* ディスプレイ＆サイドセレクター */
  .display-container {
    display: flex;
    gap: 6px;
  }
  .side-selector {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 52px;
  }
  .side-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .side-btn.active-both { background: #1e2633; border-color: #475569; color: #fff; }
  .side-btn.active-l { background: #0c2333; border-color: var(--side-l); color: var(--side-l); }
  .side-btn.active-r { background: #2b1d0c; border-color: var(--side-r); color: var(--side-r); }

  .display-box {
    flex: 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .input-target {
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .ex-display-name {
    font-size: 13px;
    font-weight: 700;
    color: #ff6b7d;
    margin-top: 2px;
  }
  .input-value {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    font-family: monospace;
  }
  .unit { font-size: 13px; color: var(--muted); margin-left: 2px; }

  /* テンキー */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    flex-grow: 1;
  }
  .num-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 19px;
    font-weight: 600;
    border-radius: 7px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .num-btn:active { background: var(--btn-active); }
  .btn-action {
    background: #2a1116;
    border-color: var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .btn-action:active { background: var(--accent); color: #fff; }

  /* ログ＆コピー */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    height: 72px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10.5px;
    color: #94a3b8;
    line-height: 1.4;
  }
  .copy-btn {
    background: #0f2418;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
  }
  .copy-btn:active { background: var(--green); color: #000; }
</style>
</head>
