<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORKOUT TERMINAL</title>
<style>
  :root {
    --bg: #090b0e;
    --panel: #13171d;
    --border: #222933;
    --text: #e1e7ed;
    --muted: #64748b;
    --accent: #ff334b;
    --green: #00e676;
    --side-l: #38bdf8;
    --side-r: #f59e0b;
    --btn-bg: #181d24;
    --btn-active: #2b3540;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 10px 12px;
    gap: 8px;
    justify-content: space-between;
  }

  /* ヘッダー */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 5px;
    box-shadow: 0 0 5px var(--green);
  }

  /* 部位タブ（押しやすい大型サイズ） */
  .category-tabs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .cat-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 0;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }
  .cat-btn.active {
    background: #1e2633;
    border-color: #3b82f6;
    color: #60a5fa;
  }

  /* 種目リスト */
  .exercise-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    max-height: 96px;
    overflow-y: auto;
  }
  .ex-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: #94a3b8;
    padding: 9px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .ex-btn.active {
    background: #231216;
    border-color: var(--accent);
    color: #ff6b7d;
  }

  /* ディスプレイ部 */
  .display-container {
    display: flex;
    gap: 8px;
  }
  .side-selector {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 58px;
  }
  .side-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .side-btn.active-both { background: #1e2633; border-color: #475569; color: #fff; }
  .side-btn.active-l { background: #0c2333; border-color: var(--side-l); color: var(--side-l); }
  .side-btn.active-r { background: #2b1d0c; border-color: var(--side-r); color: var(--side-r); }

  .display-box {
    flex: 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .input-target {
    font-size: 10px;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .ex-display-name {
    font-size: 13px;
    font-weight: 700;
    color: #ff6b7d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }
  .input-value {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    font-family: monospace;
  }
  .unit { font-size: 13px; color: var(--muted); margin-left: 3px; }

  /* テンキー（縦長＆片手親指で押しやすい設計） */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 52px) 46px;
    gap: 6px;
  }
  .num-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 21px;
    font-weight: 600;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .num-btn:active { background: var(--btn-active); }
  .btn-action {
    background: #2a1116;
    border-color: var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .btn-action:active { background: var(--accent); color: #fff; }

  /* ログプレビュー */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    height: 52px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10.5px;
    color: #94a3b8;
    line-height: 1.4;
  }

  /* チャット用一括コピーボタン */
  .copy-btn {
    background: #0f2418;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
    cursor: pointer;
  }
  .copy-btn:active { background: var(--green); color: #000; }
</style>
</head>
<body>

  <div class="header">
    <div><span class="status-dot"></span>GRANFIT24 TERMINAL</div>
    <div id="clock">00:00</div>
  </div>

  <!-- 部位タブ -->
  <div class="category-tabs">
    <div class="cat-btn active" onclick="switchCategory('胸')">胸</div>
    <div class="cat-btn" onclick="switchCategory('肩')">肩</div>
    <div class="cat-btn" onclick="switchCategory('背中')">背中</div>
    <div class="cat-btn" onclick="switchCategory('三頭')">三頭</div>
    <div class="cat-btn" onclick="switchCategory('二頭')">二頭</div>
    <div class="cat-btn" onclick="switchCategory('脚')">脚</div>
  </div>

  <!-- 種目リスト -->
  <div class="exercise-grid" id="exerciseGrid"></div>

  <!-- ディスプレイ部（L/R/両側セレクター） -->
  <div class="display-container">
    <div class="side-selector">
      <div class="side-btn active-both" id="sideBoth" onclick="setSide('')">BOTH</div>
      <div class="side-btn" id="sideL" onclick="setSide(' (L)')">L</div>
      <div class="side-btn" id="sideR" onclick="setSide(' (R)')">R</div>
    </div>
    <div class="display-box">
      <div>
        <div class="input-target" id="stepLabel">STEP 1: WEIGHT</div>
        <div class="ex-display-name" id="currentExLabel">PL ワイドチェスト</div>
      </div>
      <div class="input-value"><span id="valDisplay">--</span><span class="unit" id="unitDisplay">kg</span></div>
    </div>
  </div>

  <!-- テンキー -->
  <div class="numpad">
    <div class="num-btn" onclick="pressNum('7')">7</div>
    <div class="num-btn" onclick="pressNum('8')">8</div>
    <div class="num-btn" onclick="pressNum('9')">9</div>
    <div class="num-btn" onclick="pressNum('4')">4</div>
    <div class="num-btn" onclick="pressNum('5')">5</div>
    <div class="num-btn" onclick="pressNum('6')">6</div>
    <div class="num-btn" onclick="pressNum('1')">1</div>
    <div class="num-btn" onclick="pressNum('2')">2</div>
    <div class="num-btn" onclick="pressNum('3')">3</div>
    <div class="num-btn" onclick="pressNum('.')">.</div>
    <div class="num-btn" onclick="pressNum('0')">0</div>
    <div class="num-btn" onclick="clearVal()">CLR</div>
    <div class="num-btn btn-action" style="grid-column: span 3;" onclick="confirmStep()" id="execBtn">
      NEXT: REPS →
    </div>
  </div>

  <!-- ログパネル -->
  <div class="log-panel" id="logBox">// READY</div>
  
  <!-- チャット送信用コピーボタン -->
  <div class="copy-btn" onclick="copyForChat()">COPY FOR CHAT</div>

<script>
  // Granfit24宝塚店 仕様プリセット
  const PRESETS = {
    '胸': ['PL ワイドチェスト', 'インクラインスミス', 'ダンベルフライ', 'ペックフライ', 'ケーブルクロス', 'ディップス'],
    '肩': ['スミスミリタリー', 'ダンベルサイドレイズ', 'インクラインサイドレイズ', 'ケーブルリアデルト', 'フェイスプル', 'ダンベルショルダー'],
    '背中': ['PL ワイドプルダウン', 'ラットプルダウン', 'ベントオーバーロウ', 'ローロウ', 'シーテッドケーブルロウ', 'ワンハンドロウ'],
    '三頭': ['パラレルグリップPD', 'ローププレスダウン', 'ライイングエクステ', 'EZバーエクステ', 'キックバック'],
    '二頭': ['インクラインDBカール', 'EZバーカール', 'ケーブルカール', 'ハンマーカール', 'コンセントレーション'],
    '脚': ['PL レッグプレス', 'レッグエクステ', 'シーテッドレッグカール', 'ライイングレッグカール', 'ブルガリアンSQ', 'カーフレイズ']
  };

  let currentCategory = '胸';
  let currentExercise = PRESETS['胸'][0];
  let currentSide = '';
  let step = 1;
  let currentWeight = '';
  let currentReps = '';
  let records = [];

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toTimeString().substring(0, 5);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function switchCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === cat);
    });
    renderExerciseButtons();
    selectExercise(PRESETS[cat][0]);
  }

  function renderExerciseButtons() {
    const grid = document.getElementById('exerciseGrid');
    const items = PRESETS[currentCategory] || [];
    grid.innerHTML = items.map(name => {
      const activeClass = name === currentExercise ? 'active' : '';
      return `<div class="ex-btn ${activeClass}" onclick="selectExercise('${name}')">${name}</div>`;
    }).join('');
  }

  function selectExercise(name) {
    currentExercise = name;
    document.querySelectorAll('.ex-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === name);
    });
    updateHeaderLabel();
    resetInput();
  }

  function setSide(side) {
    currentSide = side;
    document.getElementById('sideBoth').className = 'side-btn' + (side === '' ? ' active-both' : '');
    document.getElementById('sideL').className = 'side-btn' + (side === ' (L)' ? ' active-l' : '');
    document.getElementById('sideR').className = 'side-btn' + (side === ' (R)' ? ' active-r' : '');
    updateHeaderLabel();
  }

  function updateHeaderLabel() {
    document.getElementById('currentExLabel').innerText = currentExercise + currentSide;
  }

  function pressNum(n) {
    const disp = document.getElementById('valDisplay');
    if (step === 1) {
      if (n === '.' && currentWeight.includes('.')) return;
      currentWeight += n;
      disp.innerText = currentWeight;
    } else {
      if (n === '.') return;
      currentReps += n;
      disp.innerText = currentReps;
    }
  }

  function clearVal() {
    if (step === 1) currentWeight = '';
    else currentReps = '';
    document.getElementById('valDisplay').innerText = '--';
  }

  function resetInput() {
    step = 1;
    currentWeight = '';
    currentReps = '';
    document.getElementById('stepLabel').innerText = 'STEP 1: WEIGHT';
    document.getElementById('unitDisplay').innerText = 'kg';
    document.getElementById('valDisplay').innerText = '--';
    document.getElementById('execBtn').innerText = 'NEXT: REPS →';
  }

  function confirmStep() {
    if (step === 1) {
      if (!currentWeight) return;
      step = 2;
      document.getElementById('stepLabel').innerText = 'STEP 2: REPS';
      document.getElementById('unitDisplay').innerText = 'rep';
      document.getElementById('valDisplay').innerText = '--';
      document.getElementById('execBtn').innerText = 'EXECUTE [約定]';
    } else {
      if (!currentReps) return;
      const fullExName = currentExercise + currentSide;
      records.push({ ex: fullExName, wt: currentWeight, rep: currentReps });
      renderLog();

      // 片側(L)を記録した直後なら、自動で(R)に切り替えて重量を引き継ぐアシスト
      if (currentSide === ' (L)') {
        setSide(' (R)');
        currentWeight = records[records.length - 1].wt;
        step = 2;
        document.getElementById('stepLabel').innerText = 'STEP 2: REPS';
        document.getElementById('unitDisplay').innerText = 'rep';
        document.getElementById('valDisplay').innerText = '--';
        document.getElementById('execBtn').innerText = 'EXECUTE [約定]';
      } else {
        resetInput();
      }
    }
  }

  function renderLog() {
    const box = document.getElementById('logBox');
    box.innerHTML = records.map((r, i) => `[${i+1}] ${r.ex} : ${r.wt}kg × ${r.rep}rep`).reverse().join('<br>');
  }

  // チャット連携用の一括コピー関数
  function copyForChat() {
    if (records.length === 0) return;
    
    // 種目ごとにセットを集約
    const summary = {};
    records.forEach(r => {
      if (!summary[r.ex]) summary[r.ex] = [];
      summary[r.ex].push(`${r.wt}kg × ${r.rep}`);
    });

    const now = new Date();
    const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
    let output = `【WORKOUT LOG: ${dateStr}】\n`;
    
    for (const [ex, sets] of Object.entries(summary)) {
      output += `・${ex}: ${sets.join(', ')}\n`;
    }

    navigator.clipboard.writeText(output.trim()).then(() => {
      alert('CHAT LOG COPIED!\nチャットにそのまま貼り付けて送信できます。');
    });
  }

  // 初期実行
  renderExerciseButtons();
  updateHeaderLabel();
</script>
</body>
</html>
