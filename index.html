<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WORKOUT TERMINAL</title>
<style>
  :root {
    --bg: #090b0e;
    --panel: #13171d;
    --border: #222933;
    --text: #e1e7ed;
    --muted: #64748b;
    --accent: #ff334b;
    --green: #00e676;
    --side-l: #38bdf8;
    --side-r: #f59e0b;
    --btn-bg: #181d24;
    --btn-active: #2b3540;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    padding: 8px 10px;
    gap: 6px;
    justify-content: space-between;
  }

  /* ヘッダー */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 5px;
    box-shadow: 0 0 5px var(--green);
  }

  /* 部位メインタブ（第1階層） */
  .category-tabs {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }
  .cat-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 0;
    border-radius: 5px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }
  .cat-btn.active {
    background: #1e2633;
    border-color: #3b82f6;
    color: #60a5fa;
  }

  /* 解剖学的サブカテゴリ・チップ（第2階層） */
  .subcat-bar {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .subcat-btn {
    background: #10141a;
    border: 1px solid var(--border);
    color: #818cf8;
    padding: 5px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .subcat-btn.active {
    background: #1e1b4b;
    border-color: #6366f1;
    color: #c7d2fe;
    box-shadow: 0 0 6px rgba(99, 102, 241, 0.3);
  }

  /* 種目リスト（第3階層：常に3〜5個で整理） */
  .exercise-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    min-height: 72px;
    max-height: 82px;
    overflow-y: auto;
  }
  .ex-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: #94a3b8;
    padding: 7px 8px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .ex-btn.active {
    background: #231216;
    border-color: var(--accent);
    color: #ff6b7d;
  }

  /* ディスプレイ部 */
  .display-container {
    display: flex;
    gap: 6px;
  }
  .side-selector {
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 56px;
  }
  .side-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .side-btn.active-both { background: #1e2633; border-color: #475569; color: #fff; }
  .side-btn.active-l { background: #0c2333; border-color: var(--side-l); color: var(--side-l); }
  .side-btn.active-r { background: #2b1d0c; border-color: var(--side-r); color: var(--side-r); }

  .display-box {
    flex: 1;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .input-target {
    font-size: 9.5px;
    letter-spacing: 0.5px;
    color: var(--muted);
  }
  .ex-display-name {
    font-size: 12.5px;
    font-weight: 700;
    color: #ff6b7d;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 160px;
  }
  .input-value {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    font-family: monospace;
  }
  .unit { font-size: 12px; color: var(--muted); margin-left: 2px; }

  /* テンキー */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 50px) 44px;
    gap: 5px;
  }
  .num-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    border-radius: 7px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  .num-btn:active { background: var(--btn-active); }
  .btn-action {
    background: #2a1116;
    border-color: var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .btn-action:active { background: var(--accent); color: #fff; }

  /* ログプレビュー */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
    height: 48px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10px;
    color: #94a3b8;
    line-height: 1.35;
  }

  /* コピーボタン */
  .copy-btn {
    background: #0f2418;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    cursor: pointer;
  }
  .copy-btn:active { background: var(--green); color: #000; }
</style>
</head>
<body>

  <div class="header">
    <div><span class="status-dot"></span>GRANFIT24 TERMINAL V3</div>
    <div id="clock">00:00</div>
  </div>

  <!-- 第1階層：部位タブ -->
  <div class="category-tabs">
    <div class="cat-btn active" onclick="switchMainCat('胸')">胸</div>
    <div class="cat-btn" onclick="switchMainCat('肩')">肩</div>
    <div class="cat-btn" onclick="switchMainCat('背中')">背中</div>
    <div class="cat-btn" onclick="switchMainCat('三頭')">三頭</div>
    <div class="cat-btn" onclick="switchMainCat('二頭')">二頭</div>
    <div class="cat-btn" onclick="switchMainCat('脚')">脚</div>
  </div>

  <!-- 第2階層：解剖学的サブカテゴリ・チップ -->
  <div class="subcat-bar" id="subcatBar"></div>

  <!-- 第3階層：種目リスト -->
  <div class="exercise-grid" id="exerciseGrid"></div>

  <!-- ディスプレイ部（L/R/両側） -->
  <div class="display-container">
    <div class="side-selector">
      <div class="side-btn active-both" id="sideBoth" onclick="setSide('')">BOTH</div>
      <div class="side-btn" id="sideL" onclick="setSide(' (L)')">L</div>
      <div class="side-btn" id="sideR" onclick="setSide(' (R)')">R</div>
    </div>
    <div class="display-box">
      <div>
        <div class="input-target" id="stepLabel">STEP 1: WEIGHT</div>
        <div class="ex-display-name" id="currentExLabel">--</div>
      </div>
      <div class="input-value"><span id="valDisplay">--</span><span class="unit" id="unitDisplay">kg</span></div>
    </div>
  </div>

  <!-- テンキー -->
  <div class="numpad">
    <div class="num-btn" onclick="pressNum('7')">7</div>
    <div class="num-btn" onclick="pressNum('8')">8</div>
    <div class="num-btn" onclick="pressNum('9')">9</div>
    <div class="num-btn" onclick="pressNum('4')">4</div>
    <div class="num-btn" onclick="pressNum('5')">5</div>
    <div class="num-btn" onclick="pressNum('6')">6</div>
    <div class="num-btn" onclick="pressNum('1')">1</div>
    <div class="num-btn" onclick="pressNum('2')">2</div>
    <div class="num-btn" onclick="pressNum('3')">3</div>
    <div class="num-btn" onclick="pressNum('.')">.</div>
    <div class="num-btn" onclick="pressNum('0')">0</div>
    <div class="num-btn" onclick="clearVal()">CLR</div>
    <div class="num-btn btn-action" style="grid-column: span 3;" onclick="confirmStep()" id="execBtn">
      NEXT: REPS →
    </div>
  </div>

  <!-- ログパネル -->
  <div class="log-panel" id="logBox">// READY</div>
  
  <!-- チャット送信用コピーボタン -->
  <div class="copy-btn" onclick="copyForChat()">COPY FOR CHAT</div>

<script>
  // 解剖学的マスターデータ
  const DB = {
    '胸': {
      '上部 (インクライン)': ['PL インクライン', 'インクラインスミス', 'インクラインDBプレス', 'インクラインDBフライ', 'ロープーリークロス'],
      '中部 (フラット)': ['PL ワイドチェスト', 'フラットDBプレス', 'フラットDBフライ', 'ペックフライ', 'スミスフラット'],
      '下部 (デクライン)': ['PL デクライン', 'ディップス (胸)', 'ハイプーリークロス']
    },
    '肩': {
      '前部 (フロント)': ['スミスミリタリー', 'ダンベルショルダー', 'スミスインクラインF', 'ケーブルフロントレイズ'],
      '中部 (サイド)': ['ダンベルサイドレイズ', 'インクラインサイドレイズ', 'ケーブルサイドレイズ'],
      '後部 (リア)': ['ケーブルリアデルト', 'ダンベルリアデルト', 'ペックリア', 'フェイスプル']
    },
    '背中': {
      '上部/外側 (垂直引き)': ['PL ワイドプルダウン', 'ラットプルダウン', 'PL ハイロウ (DY)', 'アシストプルアップ'],
      '中下部/内側 (水平引き)': ['ベントオーバーロウ', 'Tバーロウ', 'ローロウ', 'シーテッドケーブルロウ', 'ダンベルワンハンドロウ']
    },
    '三頭': {
      '長頭 (ストレッチ)': ['ライイングエクステ', 'EZバーエクステ', 'オーバーヘッドケーブル'],
      '外側・内側 (プレス)': ['パラレルグリップPD', 'ローププレスダウン', 'ディップス (三頭)', 'キックバック']
    },
    '二頭': {
      '長頭・短頭': ['インクラインDBカール', 'EZバーカール', 'ケーブルカール', 'コンセントレーション'],
      '上腕筋・腕橈骨筋': ['ハンマーカール', 'リバースカール']
    },
    '脚': {
      '大腿四頭筋 (前)': ['PL レッグプレス', 'レッグエクステ', 'ハックスクワット', 'ブルガリアンSQ'],
      'ハム・臀部 (後)': ['シーテッドレッグカール', 'ライイングレッグカール', 'ルーマニアンDL', 'カーフレイズ']
    }
  };

  let currentMain = '胸';
  let currentSub = Object.keys(DB['胸'])[0];
  let currentExercise = DB['胸'][currentSub][0];
  let currentSide = '';
  let step = 1;
  let currentWeight = '';
  let currentReps = '';
  let records = [];

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toTimeString().substring(0, 5);
  }
  setInterval(updateClock, 1000);
  updateClock();

  function switchMainCat(cat) {
    currentMain = cat;
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === cat);
    });
    renderSubCats();
  }

  function renderSubCats() {
    const subBar = document.getElementById('subcatBar');
    const subs = Object.keys(DB[currentMain]);
    currentSub = subs[0];
    
    subBar.innerHTML = subs.map((sub, i) => 
      `<div class="subcat-btn ${i === 0 ? 'active' : ''}" onclick="switchSubCat('${sub}')">${sub}</div>`
    ).join('');
    
    renderExercises();
  }

  function switchSubCat(sub) {
    currentSub = sub;
    document.querySelectorAll('.subcat-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === sub);
    });
    renderExercises();
  }

  function renderExercises() {
    const grid = document.getElementById('exerciseGrid');
    const items = DB[currentMain][currentSub] || [];
    currentExercise = items[0];
    
    grid.innerHTML = items.map((name, i) => 
      `<div class="ex-btn ${i === 0 ? 'active' : ''}" onclick="selectExercise('${name}')">${name}</div>`
    ).join('');
    
    updateHeaderLabel();
    resetInput();
  }

  function selectExercise(name) {
    currentExercise = name;
    document.querySelectorAll('.ex-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === name);
    });
    updateHeaderLabel();
    resetInput();
  }

  function setSide(side) {
    currentSide = side;
    document.getElementById('sideBoth').className = 'side-btn' + (side === '' ? ' active-both' : '');
    document.getElementById('sideL').className = 'side-btn' + (side === ' (L)' ? ' active-l' : '');
    document.getElementById('sideR').className = 'side-btn' + (side === ' (R)' ? ' active-r' : '');
    updateHeaderLabel();
  }

  function updateHeaderLabel() {
    document.getElementById('currentExLabel').innerText = currentExercise + currentSide;
  }

  function pressNum(n) {
    const disp = document.getElementById('valDisplay');
    if (step === 1) {
      if (n === '.' && currentWeight.includes('.')) return;
      currentWeight += n;
      disp.innerText = currentWeight;
    } else {
      if (n === '.') return;
      currentReps += n;
      disp.innerText = currentReps;
    }
  }

  function clearVal() {
    if (step === 1) currentWeight = '';
    else currentReps = '';
    document.getElementById('valDisplay').innerText = '--';
  }

  function resetInput() {
    step = 1;
    currentWeight = '';
    currentReps = '';
    document.getElementById('stepLabel').innerText = 'STEP 1: WEIGHT';
    document.getElementById('unitDisplay').innerText = 'kg';
    document.getElementById('valDisplay').innerText = '--';
    document.getElementById('execBtn').innerText = 'NEXT: REPS →';
  }

  function confirmStep() {
    if (step === 1) {
      if (!currentWeight) return;
      step = 2;
      document.getElementById('stepLabel').innerText = 'STEP 2: REPS';
      document.getElementById('unitDisplay').innerText = 'rep';
      document.getElementById('valDisplay').innerText = '--';
      document.getElementById('execBtn').innerText = 'EXECUTE [約定]';
    } else {
      if (!currentReps) return;
      const fullExName = currentExercise + currentSide;
      records.push({ ex: fullExName, wt: currentWeight, rep: currentReps });
      renderLog();

      if (currentSide === ' (L)') {
        setSide(' (R)');
        currentWeight = records[records.length - 1].wt;
        step = 2;
        document.getElementById('stepLabel').innerText = 'STEP 2: REPS';
        document.getElementById('unitDisplay').innerText = 'rep';
        document.getElementById('valDisplay').innerText = '--';
        document.getElementById('execBtn').innerText = 'EXECUTE [約定]';
      } else {
        resetInput();
      }
    }
  }

  function renderLog() {
    const box = document.getElementById('logBox');
    box.innerHTML = records.map((r, i) => `[${i+1}] ${r.ex} : ${r.wt}kg × ${r.rep}rep`).reverse().join('<br>');
  }

  function copyForChat() {
    if (records.length === 0) return;
    const summary = {};
    records.forEach(r => {
      if (!summary[r.ex]) summary[r.ex] = [];
      summary[r.ex].push(`${r.wt}kg × ${r.rep}`);
    });

    const now = new Date();
    const dateStr = `${now.getMonth() + 1}/${now.getDate()}`;
    let output = `【WORKOUT LOG: ${dateStr}】\n`;
    for (const [ex, sets] of Object.entries(summary)) {
      output += `・${ex}: ${sets.join(', ')}\n`;
    }

    navigator.clipboard.writeText(output.trim()).then(() => {
      alert('CHAT LOG COPIED!\nチャットにそのまま貼り付けて送信できます。');
    });
  }

  // 初期初期化
  renderSubCats();
</script>
</body>
</html>
