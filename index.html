<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WORKOUT TERMINAL</title>
<style>
  :root {
    --bg: #0d0f12;
    --panel: #161a1f;
    --border: #232931;
    --text: #e1e7ed;
    --accent: #ff334b; /* クリムゾンレッド */
    --green: #00e676;
    --btn-bg: #1c2229;
    --btn-active: #2b3540;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "SF Pro Display", monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 12px;
    gap: 10px;
  }
  /* ヘッダー */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 6px;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #6c7987;
    border-bottom: 1px solid var(--border);
  }
  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 5px;
    box-shadow: 0 0 6px var(--green);
  }
  /* 銘柄セレクター */
  .tag-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .tag-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: #8b98a5;
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    text-align: center;
  }
  .tag-btn.active {
    background: #221217;
    border-color: var(--accent);
    color: #ff6b7d;
    box-shadow: 0 0 8px rgba(255, 51, 75, 0.2);
  }
  /* ターミナル入力・表示ディスプレイ */
  .display-box {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .input-target {
    font-size: 13px;
    color: #6c7987;
    letter-spacing: 1px;
  }
  .input-value {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    font-family: monospace;
  }
  .unit { font-size: 14px; color: #6c7987; margin-left: 2px; }
  /* テンキーグリッド */
  .numpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    flex-grow: 1;
  }
  .num-btn {
    background: var(--btn-bg);
    border: 1px solid var(--border);
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.05s;
  }
  .num-btn:active { background: var(--btn-active); border-color: #4f5d6b; }
  .btn-action {
    background: #2a1116;
    border-color: var(--accent);
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .btn-action:active { background: var(--accent); color: #fff; }
  /* ログプレビュー＆コピー */
  .log-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    height: 80px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 11px;
    color: #a4b1be;
    line-height: 1.5;
  }
  .copy-btn {
    background: #112419;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-align: center;
  }
  .copy-btn:active { background: var(--green); color: #000; }
</style>
</head>
<body>

  <div class="header">
    <div><span class="status-dot"></span>PORTFOLIO LOG</div>
    <div id="clock">00:00</div>
  </div>

  <!-- 主要銘柄 -->
  <div class="tag-grid" id="exerciseGrid">
    <div class="tag-btn active" onclick="setEx('PL チェスト')">PLチェスト</div>
    <div class="tag-btn" onclick="setEx('スミスミリタリー')">スミス肩</div>
    <div class="tag-btn" onclick="setEx('プレスダウン')">三頭プレス</div>
    <div class="tag-btn" onclick="setEx('PL ワイドプル')">PLプル</div>
    <div class="tag-btn" onclick="setEx('ベントオーバー')">ベントロウ</div>
    <div class="tag-btn" onclick="setEx('PL レッグプレス')">レッグプレス</div>
  </div>

  <!-- ディスプレイ -->
  <div class="display-box">
    <div>
      <div class="input-target" id="stepLabel">STEP 1: WEIGHT</div>
      <div style="font-size:12px; color:#ff6b7d;" id="currentExLabel">PL チェスト</div>
    </div>
    <div class="input-value"><span id="valDisplay">--</span><span class="unit" id="unitDisplay">kg</span></div>
  </div>

  <!-- テンキー -->
  <div class="numpad">
    <div class="num-btn" onclick="pressNum('7')">7</div>
    <div class="num-btn" onclick="pressNum('8')">8</div>
    <div class="num-btn" onclick="pressNum('9')">9</div>
    <div class="num-btn" onclick="pressNum('4')">4</div>
    <div class="num-btn" onclick="pressNum('5')">5</div>
    <div class="num-btn" onclick="pressNum('6')">6</div>
    <div class="num-btn" onclick="pressNum('1')">1</div>
    <div class="num-btn" onclick="pressNum('2')">2</div>
    <div class="num-btn" onclick="pressNum('3')">3</div>
    <div class="num-btn" onclick="pressNum('.')">.</div>
    <div class="num-btn" onclick="pressNum('0')">0</div>
    <div class="num-btn" onclick="clearVal()">CLR</div>
    <div class="num-btn btn-action" style="grid-column: span 3; height: 46px;" onclick="confirmStep()" id="execBtn">
      NEXT: REPS →
    </div>
  </div>

  <!-- ログ -->
  <div class="log-panel" id="logBox">// EXECUTION LOGS...</div>
  <div class="copy-btn" onclick="copyTSV()">COPY NOTION TSV</div>

<script>
  let currentEx = 'PL チェスト';
  let step = 1; // 1: weight, 2: reps
  let currentWeight = '';
  let currentReps = '';
  let records = [];

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toTimeString().split(' ')[0].substring(0,5);
  }
  setInterval(updateClock, 1000); updateClock();

  function setEx(name) {
    currentEx = name;
    document.querySelectorAll('.tag-btn').forEach(b => {
      b.classList.toggle('active', b.innerText.includes(name.substring(0,3)));
    });
    document.getElementById('currentExLabel').innerText = name;
    resetInput();
  }

  function pressNum(n) {
    const disp = document.getElementById('valDisplay');
    if (step === 1) {
      if (n === '.' && currentWeight.includes('.')) return;
      currentWeight += n;
      disp.innerText = currentWeight;
    } else {
      if (n === '.') return;
      currentReps += n;
      disp.innerText = currentReps;
    }
  }

  function clearVal() {
    if (step === 1) currentWeight = '';
    else currentReps = '';
    document.getElementById('valDisplay').innerText = '--';
  }

  function resetInput() {
    step = 1;
    currentWeight = '';
    currentReps = '';
    document.getElementById('stepLabel').innerText = 'STEP 1: WEIGHT';
    document.getElementById('unitDisplay').innerText = 'kg';
    document.getElementById('valDisplay').innerText = '--';
    document.getElementById('execBtn').innerText = 'NEXT: REPS →';
  }

  function confirmStep() {
    if (step === 1) {
      if (!currentWeight) return;
      step = 2;
      document.getElementById('stepLabel').innerText = 'STEP 2: REPS';
      document.getElementById('unitDisplay').innerText = 'rep';
      document.getElementById('valDisplay').innerText = '--';
      document.getElementById('execBtn').innerText = 'EXECUTE [約定]';
    } else {
      if (!currentReps) return;
      const rec = { ex: currentEx, wt: currentWeight, rep: currentReps };
      records.push(rec);
      renderLog();
      resetInput();
    }
  }

  function renderLog() {
    const box = document.getElementById('logBox');
    box.innerHTML = records.map((r, i) => `[${i+1}] ${r.ex} : ${r.wt}kg × ${r.rep}rep`).reverse().join('<br>');
  }

  function copyTSV() {
    if (records.length === 0) return;
    const tsv = records.map(r => `${r.ex}\t${r.wt}\t${r.rep}`).join('\n');
    navigator.clipboard.writeText(tsv).then(() => {
      alert('NOTION TSV COPIED!');
    });
  }
</script>
</body>
</html>
